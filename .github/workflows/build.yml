name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default: builds of pull requests cannot change the repository or releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make mingw-w64-x86_64-nsis

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        run: make

      - name: Run unit tests
        shell: msys2 {0}
        run: make test

      - name: Fetch HeadsetControl binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $hc = 'third_party/headsetcontrol/headsetcontrol.exe'
          New-Item -ItemType Directory -Force (Split-Path $hc) | Out-Null
          Invoke-WebRequest 'https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-windows-x86_64.exe' -OutFile $hc
          $hash = (Get-FileHash $hc -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'e371da043710ddb8fc70af77f2ccad1cd03f8c6f49ba423e08764ad7a94a3c40') { throw "HeadsetControl checksum mismatch: $hash" }

      - name: Build installer (NSIS)
        shell: msys2 {0}
        run: makensis installer/Wireless-Device-Battery-Monitor-CN.nsi

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item LICENSE -Destination LICENSE.txt
          Compress-Archive -Force -Path WirelessBattery.exe,third_party/headsetcontrol/headsetcontrol.exe,LICENSE.txt,installer/README.txt,installer/THIRD_PARTY_NOTICES.txt -DestinationPath "dist/Wireless-Device-Battery-Monitor-CN-$version-portable.zip"

      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery-CN
          path: dist/*

  # Only this job can publish, and only for version tags.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBattery-CN
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          append_body: true
          body: |
            本次发布由 CI 自动构建：安装包 `Wireless-Device-Battery-Monitor-CN-Setup-*.exe`、便携版 zip，以及随包分发的 HeadsetControl 4.3.0 对应源码。

            原项目 **Wireless Battery** 由 krisgfx（[@krisgfx9](https://github.com/krisgfx9)）编写，本项目是其简体中文本地化分支，按 GNU GPLv3 发布；原作者与上游贡献者见 [CONTRIBUTORS.md](CONTRIBUTORS.md)。上游赞助渠道请前往 [原仓库](https://github.com/krisgfx9/Wireless-Device-Battery-Monitor)。
